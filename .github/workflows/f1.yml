name: f1-predictor
on:
  schedule:
    - cron: "5 * * * *"          # ogni ora, ogni giorno (orario UTC)
    - cron: "*/15 * * * 5,6,0"   # ogni 15 min venerdi-domenica, per il promemoria 30 minuti prima
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: f1
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m src.run
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Salva database e modelli
        run: |
          git config user.name "f1-bot"
          git config user.email "f1-bot@users.noreply.github.com"
          git add data models
          git diff --cached --quiet || (git commit -m "aggiornamento automatico" && git push)
