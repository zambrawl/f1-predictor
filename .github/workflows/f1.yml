name: f1-predictor
on:
  schedule:
    - cron: "*/5 * * * 5,6,0"    # ogni 5 minuti venerdi-domenica (orario UTC): il massimo consentito da GitHub
    - cron: "*/15 * * * 1-4"     # ogni 15 minuti lunedi-giovedi
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: f1
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m src.run
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Salva database e modelli
        run: |
          git config user.name "f1-bot"
          git config user.email "f1-bot@users.noreply.github.com"
          git add data models
          if ! git diff --cached --quiet; then
            git commit -m "aggiornamento automatico"
            git pull --rebase origin main
            git push
          fi
